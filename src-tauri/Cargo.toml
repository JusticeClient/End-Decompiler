[package]
name = "endecompiler"
version = "0.1.0"
description = "Java decompiler and static malware-analysis tool for Minecraft mod jars"
authors = ["Endecompiler"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "endecompiler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
base64 = "0.22"
once_cell = "1"
goblin = "0.8"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "nasm"] }
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
rayon = "1"
tempfile = "3"
anyhow = "1"
which = "7"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
